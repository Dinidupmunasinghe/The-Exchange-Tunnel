# Keeps the free Render API instance from sleeping (it spins down after ~15 min idle,
# and a cold start can take a minute or more). /api/health does not touch the database,
# so this does not use Neon compute time. Free for public repositories.
name: Keep API awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping API health
        run: |
          for i in 1 2 3; do
            if curl -fsS -m 90 https://the-exchange-tunnel.onrender.com/api/health; then
              echo; echo "API is awake"; exit 0
            fi
            echo "attempt $i failed, retrying..."; sleep 15
          done
          echo "API did not respond"; exit 1
