
  <!DOCTYPE html>
  <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <meta
        name="description"
        content="Exchange Tunnel — credit-based task exchange for Telegram channel posts and growth."
      />
      <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
      <title>Exchange Tunnel</title>
      <script>
        // No-FOUC: set theme class before paint based on stored preference or OS hint.
        (function () {
          try {
            var stored = localStorage.getItem("exchange_theme");
            var theme =
              stored === "light" || stored === "dark"
                ? stored
                : window.matchMedia &&
                  window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
            var root = document.documentElement;
            if (theme === "dark") {
              root.classList.add("dark");
            } else {
              root.classList.remove("dark");
            }
            root.style.colorScheme = theme;
          } catch (e) {
            document.documentElement.classList.add("dark");
          }
        })();
      </script>
    </head>

    <body>
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
    </body>
  </html>
